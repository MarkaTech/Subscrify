name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: subscrify
          POSTGRES_PASSWORD: subscrify
          POSTGRES_DB: subscrify_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U subscrify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://subscrify:subscrify@localhost:5432/subscrify_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lockfiles are intentionally untracked (see .gitignore) — the sandbox
      # that authors code resolves different versions than deploy machines.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations to a clean Postgres
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
