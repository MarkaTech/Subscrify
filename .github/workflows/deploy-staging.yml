name: Deploy staging (Azure)

# Manual trigger only until the Azure subscription is wired up.
# Prereqs (one-time, owner's Azure):
#   1. An Entra app registration with a federated credential for this repo
#      (subject: repo:MarkaTech/subscrify:ref:refs/heads/main).
#   2. Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#   3. Resource group "subscrify-staging" in the chosen region.
#   4. Repo secret POSTGRES_ADMIN_PASSWORD (any strong generated value; it
#      lands in Key Vault and is never read by humans).
# No cloud credentials are ever stored — OIDC only.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure (Bicep)
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
        # The Bicep template's webImage param defaults to a hello-world
        # placeholder; without passing the currently-deployed image, every
        # infra deploy would reset the app to that placeholder.
        run: |
          IMG=$(az containerapp show -n subscrify-staging-web -g subscrify-staging \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          EXTRA=""
          case "$IMG" in *azurecr.io*) EXTRA="--parameters webImage=$IMG";; esac
          az deployment group create \
            --resource-group subscrify-staging \
            --template-file infra/main.bicep \
            --parameters infra/staging.bicepparam $EXTRA

      # Lockfiles are intentionally untracked in git (see .gitignore); the
      # container build needs one, so the pipeline generates it fresh here.
      - name: Generate lockfile for container build
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Build and deploy web container
        run: |
          az extension add --name containerapp --upgrade
          az containerapp up \
            --name subscrify-staging-web \
            --resource-group subscrify-staging \
            --source . \
            --ingress external --target-port 3000
