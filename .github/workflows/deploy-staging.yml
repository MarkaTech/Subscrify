name: Deploy staging (Azure)

# Manual trigger only until the Azure subscription is wired up.
# Prereqs (one-time, owner's Azure):
#   1. An Entra app registration with a federated credential for this repo
#      (subject: repo:MarkaTech/subscrify:ref:refs/heads/main).
#   2. Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#   3. Resource group "subscrify-staging" in the chosen region.
#   4. Repo secret POSTGRES_ADMIN_PASSWORD (any strong generated value; it
#      lands in Key Vault and is never read by humans).
# No cloud credentials are ever stored — OIDC only.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Lockfiles are intentionally untracked in git (see .gitignore); the
      # container build needs one, so the pipeline generates it fresh here.
      - name: Generate lockfile for container build
        run: npm install --package-lock-only --no-audit --no-fund

      # Build in ACR (never `az containerapp up` — it manages a container named
      # after the app, which duplicates the Bicep-defined "web" container and
      # crash-loops on a port conflict; two containers in one replica share
      # one network namespace).
      - name: Build image in ACR
        run: |
          az acr build --registry caca4d77ed2eacr \
            --image subscrify-staging-web:${{ github.sha }} .

      - name: Deploy infrastructure (Bicep)
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
        # Bicep is the single owner of the container app template: exactly one
        # container named "web", running the image just built. A full template
        # PUT also strips any stray containers left by older tooling.
        run: |
          az deployment group create \
            --resource-group subscrify-staging \
            --template-file infra/main.bicep \
            --parameters infra/staging.bicepparam \
            --parameters webImage=caca4d77ed2eacr.azurecr.io/subscrify-staging-web:${{ github.sha }}
