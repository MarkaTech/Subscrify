name: Deploy Shopify config + extensions

# Pushes shopify.app.toml (URLs, scopes, webhooks) and all extensions to
# Shopify. Requires repo secret SHOPIFY_APP_AUTOMATION_TOKEN — an App
# Automation Token created in the Dev Dashboard (app → Settings → App
# Automation Token). The token is scoped to this app only.
on:
  workflow_dispatch:

concurrency: deploy-shopify

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Deploy app configuration and extensions
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: shopify app deploy --allow-updates
