# Shopify app configuration for Marka Subscrify.
# App: Marka Subscrify (Dev Dashboard app ID 403702841345, handle subscrify-1)
# Partner org: MARKA MODERN RETAIL PRIVATE LIMITED
# Dev store: subscrify-test.myshopify.com

client_id = "fc17a27061513df7a7c4dda09476d3cb"
# Display name only — safe to change. The `handle` below is NOT: it appears in
# every embedded admin URL (/apps/subscrify-1/...), including the deep link
# Shopify puts on subscription line items in the order admin. Renaming it
# breaks those links for existing installs.
name = "Marka Subscrify"
handle = "subscrify-1"
application_url = "https://subscrify-staging-web.victoriousriver-73bb1ad1.centralindia.azurecontainerapps.io"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "subscrify-test.myshopify.com"

[access_scopes]
# read_customer_payment_methods / *_own_subscription_contracts / read_customers /
# read_orders are protected scopes — Protected Customer Data access (Name, Email,
# Address, Phone) was granted for this app on 2026-07-30 via the Partner
# Dashboard, which is what makes read_customers/read_orders usable here: the
# scopes alone are useless for PII fields without that separate approval.
# Adding these two (2026-07-31) lets contracts.api.server.ts's "rich" query
# populate customer name/email and origin order instead of falling back.
scopes = "write_products,write_purchase_options,read_customer_payment_methods,read_own_subscription_contracts,write_own_subscription_contracts,read_customers,read_orders"

[webhooks]
api_version = "2026-07"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Billing engine (Phase 4) — the async result of a subscriptionBillingAttemptCreate
  # charge. Handled by: /app/routes/webhooks.subscription_billing_attempts.*.tsx
  [[webhooks.subscriptions]]
  topics = ["subscription_billing_attempts/success"]
  uri = "/webhooks/subscription_billing_attempts/success"

  [[webhooks.subscriptions]]
  topics = ["subscription_billing_attempts/failure"]
  uri = "/webhooks/subscription_billing_attempts/failure"

  [[webhooks.subscriptions]]
  topics = ["subscription_billing_attempts/challenged"]
  uri = "/webhooks/subscription_billing_attempts/challenged"

  # Mandatory privacy compliance topics for public apps.
  # Handled by: /app/routes/webhooks.customers.data_request.tsx etc.
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[auth]
redirect_urls = [
  "https://subscrify-staging-web.victoriousriver-73bb1ad1.centralindia.azurecontainerapps.io/auth/callback",
]

[pos]
embedded = false
