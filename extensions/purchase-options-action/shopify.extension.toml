api_version = "2026-07"

[[extensions]]
# Display name only. `handle` is the extension's stable identifier with
# Shopify — leave it as-is.
name = "Marka Subscrify purchase options"
handle = "subscrify-purchase-options"
type = "ui_extension"

  [[extensions.targeting]]
  module = "./src/ActionExtension.jsx"
  target = "admin.product-purchase-option.action.render"

  [[extensions.targeting]]
  module = "./src/ActionExtension.jsx"
  target = "admin.product-variant-purchase-option.action.render"
